name: Vaani CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Unit Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff

      - name: Validate FAQ JSON schema
        run: |
          python -c "import json; data = json.load(open('data/faq.json')); assert isinstance(data, list) and len(data) > 0, 'Invalid faq.json'"

      - name: Run Ruff syntax and critical lint checks
        run: |
          ruff check backend/ frontend/ tests/ --select=E9,F63,F7,F82

      - name: Run Pytest suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ENABLE_STT: "false"
          ENABLE_TTS: "false"
        run: |
          pytest tests/ -v --tb=short

  docker-build-smoke-test:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml syntax
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          docker compose config -q

      - name: Build Vaani Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vaani-support:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max