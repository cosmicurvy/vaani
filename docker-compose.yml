services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaani-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=http://localhost:8501,http://127.0.0.1:8501
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    command: >
      sh -c "if [ ! -d /app/data/qdrant ] || [ ! -f /app/data/bm25_documents.pkl ]; then
               echo 'Building Qdrant and BM25 indexes...';
               python backend/rag/indexer.py;
             fi &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaani-frontend
    ports:
      - "8501:8501"
    environment:
      - VAANI_API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    command: >
      streamlit run frontend/streamlit_app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    restart: unless-stopped

volumes:
  hf_cache: